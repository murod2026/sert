<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sertifikatni tekshirish — Uyg'un ta'lim</title>
<meta name="description" content="«UYG'UN TA'LIM» MChJ bergan sertifikatning haqiqiyligini tekshirish">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --krem: #FBF7EE;
    --oltin: #B8912F;
    --oltin-och: #DCC27A;
    --kok: #241A72;
    --matn: #2B2A26;
    --kulrang: #5F5A50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--krem); color: var(--matn);
    font-family: Inter, system-ui, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  main { flex: 1; width: 100%; max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
  .logo { display: block; width: 240px; max-width: 70%; margin: 0 auto 10px; }
  .tashkilot { text-align: center; font-size: 11px; letter-spacing: 0.14em; color: var(--kulrang); margin-bottom: 28px; }
  h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 30px; font-weight: 600; letter-spacing: 0.06em; color: var(--kok); text-align: center; margin: 0 0 6px; }
  .izoh { text-align: center; font-size: 14px; color: var(--kulrang); margin: 0 0 26px; line-height: 1.6; }

  .karta { background: #fff; border: 1px solid var(--oltin-och); border-radius: 14px; padding: 22px; }
  label { display: block; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--kulrang); margin-bottom: 6px; }
  input {
    width: 100%; height: 48px; padding: 0 14px; font-size: 16px; font-family: inherit;
    color: var(--matn); background: var(--krem);
    border: 1px solid var(--oltin-och); border-radius: 10px; margin-bottom: 16px;
  }
  input:focus { outline: 2px solid var(--kok); outline-offset: 1px; }
  button {
    width: 100%; height: 50px; border: none; border-radius: 10px;
    background: var(--kok); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #1a1356; }
  button[disabled] { opacity: 0.6; cursor: default; }

  .natija { margin-top: 22px; border-radius: 14px; padding: 22px; border: 1px solid var(--oltin-och); background: #fff; }
  .natija.haqiqiy { border-left: 6px solid #1F6B45; }
  .natija.topilmadi { border-left: 6px solid #9C2B2B; }
  .belgi { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; margin-bottom: 16px; }
  .haqiqiy .belgi { color: #1F6B45; }
  .topilmadi .belgi { color: #9C2B2B; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; }
  dt { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--kulrang); }
  dd { margin: 0; font-size: 15px; font-weight: 600; }
  dd.ism { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 22px; font-weight: 700; }
  .xato { color: #9C2B2B; font-size: 14px; margin-top: 16px; line-height: 1.6; }

  footer { border-top: 1px solid var(--oltin-och); padding: 20px 16px 28px; text-align: center; font-size: 12px; color: var(--kulrang); line-height: 1.8; }
  footer a { color: var(--kok); }
  @media (max-width: 420px) { dl { grid-template-columns: 1fr; gap: 4px 0; } dt { margin-top: 10px; } }
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.svg" alt="Uyg'un ta'lim">
  <div class="tashkilot">«Uyg'un ta'lim» ijtimoiy-iqtisodiy infratuzilmasi</div>

  <h1>Sertifikatni tekshirish</h1>
  <p class="izoh">Sertifikatdagi QR kodni skanerlang yoki raqam va tekshiruv kodini kiriting.</p>

  <form class="karta" id="shakl" autocomplete="off">
    <label for="raqam">Sertifikat raqami</label>
    <input id="raqam" name="raqam" placeholder="UT-UIQ-2026-00147" required>
    <label for="kod">Tekshiruv kodi</label>
    <input id="kod" name="kod" placeholder="QR kod ichidagi kod" required>
    <button type="submit" id="tugma">Tekshirish</button>
  </form>

  <div id="natija" hidden></div>
</main>

<footer>
  «UYG'UN TA'LIM» MCHJ · <a href="bitiruvchilar.html">Bitiruvchilar ro'yxati</a> · <a href="maxfiylik.html">Maxfiylik siyosati</a><br>
  Savollar uchun: <a href="mailto:qobiliy.isaev@gmail.com">qobiliy.isaev@gmail.com</a>
</footer>

<script>
const SUPABASE_URL = "https://bwiqzxagqztahqncmebn.supabase.co";
const SUPABASE_KEY = "sb_publishable_wgpaMl8Uk_-E4TvQTJkfPQ_U2IoCj43";

const shakl = document.getElementById("shakl");
const natijaEl = document.getElementById("natija");
const tugma = document.getElementById("tugma");

function xavfsiz(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function sanaFormat(s) {
  if (!s) return "—";
  const [y, m, d] = String(s).split("-");
  return (y && m && d) ? `${d}.${m}.${y}` : s;
}

function chiqar(html, sinf) {
  natijaEl.className = "natija " + (sinf || "");
  natijaEl.innerHTML = html;
  natijaEl.hidden = false;
}

async function tekshir(raqam, kod) {
  tugma.disabled = true;
  tugma.textContent = "Tekshirilmoqda…";
  try {
    const javob = await fetch(SUPABASE_URL + "/rest/v1/rpc/sertifikat_tekshirish", {
      method: "POST",
      headers: { "apikey": SUPABASE_KEY, "Authorization": "Bearer " + SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_sert_id: raqam, p_kod: kod })
    });
    if (!javob.ok) throw new Error("HTTP " + javob.status);
    const qatorlar = await javob.json();
    const s = Array.isArray(qatorlar) ? qatorlar[0] : qatorlar;

    if (!s || s.holat !== "haqiqiy") {
      chiqar(
        '<div class="belgi"><span aria-hidden="true">✕</span> Sertifikat topilmadi</div>' +
        '<p style="margin:0;font-size:14px;line-height:1.7;color:#5F5A50">Kiritilgan raqam yoki tekshiruv kodi noto‘g‘ri. ' +
        'Ularni sertifikatdagi yozuv bilan solishtiring.</p>', "topilmadi");
      return;
    }

    chiqar(
      '<div class="belgi"><span aria-hidden="true">✓</span> Haqiqiy sertifikat</div>' +
      '<dl>' +
        '<dt>Egasi</dt><dd class="ism">' + xavfsiz(s.ism) + '</dd>' +
        '<dt>Fan</dt><dd>' + xavfsiz(s.fan) + '</dd>' +
        '<dt>Raqami</dt><dd>' + xavfsiz(s.raqam) + '</dd>' +
        '<dt>Berilgan sana</dt><dd>' + sanaFormat(s.sana) + '</dd>' +
      '</dl>', "haqiqiy");
  } catch (e) {
    chiqar('<p class="xato">Ma’lumotni olishda xatolik yuz berdi. Internet aloqasini tekshirib, qaytadan urinib ko‘ring.</p>', "");
  } finally {
    tugma.disabled = false;
    tugma.textContent = "Tekshirish";
  }
}

shakl.addEventListener("submit", e => {
  e.preventDefault();
  const raqam = document.getElementById("raqam").value.trim();
  const kod = document.getElementById("kod").value.trim();
  if (raqam && kod) tekshir(raqam, kod);
});

// QR havolasi: ?id=UT-UIQ-2026-00147&k=xxxxxxxxxx
const p = new URLSearchParams(location.search);
const qId = p.get("id"), qK = p.get("k");
if (qId && qK) {
  document.getElementById("raqam").value = qId;
  document.getElementById("kod").value = qK;
  tekshir(qId, qK);
}
</script>
</body>
</html>
